<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MediCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <a href="{{ url_for('dashboard') }}" class="logo">
        Medi<span>Care</span>
    </a>

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Home
        </a>

        <a href="{{ url_for('doctors') }}">
            Doctors
        </a>

        <a href="{{ url_for('register') }}" class="nav-btn">
            Register
        </a>

    </div>

</nav>


<div class="auth-page">

    <div class="auth-card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to access your MediCare account.
        </p>


        <form method="POST"
              action="{{ url_for('login') }}">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary form-submit">

                Login

            </button>

        </form>


        <p style="text-align:center; margin-top:22px; color:#64748b;">

            Don't have an account?

            <a href="{{ url_for('register') }}"
               style="color:#0b7fab; font-weight:600;">

                Create Account

            </a>

        </p>

    </div>

</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
