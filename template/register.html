<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - MediCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <a href="{{ url_for('dashboard') }}" class="logo">
        Medi<span>Care</span>
    </a>

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Home
        </a>

        <a href="{{ url_for('doctors') }}">
            Doctors
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</nav>


<div class="auth-page">

    <div class="auth-card">

        <h2>Create Account</h2>

        <p class="subtitle">
            Register for your MediCare account.
        </p>


        <form method="POST"
              action="{{ url_for('register') }}">


            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="form-group">

                <label>Register As</label>

                <select name="role"
                        id="role"
                        onchange="showRoleFields()"
                        required>

                    <option value="">
                        Select role
                    </option>

                    <option value="patient">
                        Patient
                    </option>

                    <option value="doctor">
                        Doctor
                    </option>

                </select>

            </div>


            <!-- PATIENT FIELDS -->

            <div id="patientFields"
                 style="display:none;">

                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter phone number">

                </div>


                <div class="form-group">

                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="date_of_birth">

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select name="gender">

                        <option value="">
                            Select gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <!-- DOCTOR FIELDS -->

            <div id="doctorFields"
                 style="display:none;">

                <div class="form-group">

                    <label>Specialization</label>

                    <input
                        type="text"
                        name="specialization"
                        placeholder="e.g. Cardiologist">

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter phone number">

                </div>


                <div class="form-group">

                    <label>Experience</label>

                    <input
                        type="number"
                        name="experience"
                        placeholder="Years of experience"
                        min="0">

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary form-submit">

                Create Account

            </button>

        </form>


        <p style="text-align:center; margin-top:22px; color:#64748b;">

            Already have an account?

            <a href="{{ url_for('login') }}"
               style="color:#0b7fab; font-weight:600;">

                Login

            </a>

        </p>

    </div>

</div>


<script>

function showRoleFields() {

    const role =
        document.getElementById("role").value;

    const patientFields =
        document.getElementById("patientFields");

    const doctorFields =
        document.getElementById("doctorFields");


    patientFields.style.display = "none";
    doctorFields.style.display = "none";


    if (role === "patient") {

        patientFields.style.display = "block";

    }

    else if (role === "doctor") {

        doctorFields.style.display = "block";

    }

}

</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
